<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQA Physics - Foundation Tier Diagnostic</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f7fafc;
      color: #1a202c;
      line-height: 1.6;
      min-height: 100vh;
    }

    #root {
      min-height: 100vh;
    }

    .app-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
    }

    /* Welcome Screen */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
    }

    .welcome-card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      max-width: 600px;
      width: 100%;
    }

    .welcome-card h1 {
      color: #1a365d;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .welcome-card .subtitle {
      color: #2b6cb0;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .welcome-card .description {
      color: #4a5568;
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.7;
    }

    .welcome-card .info-box {
      background: #ebf8ff;
      border-left: 4px solid #2b6cb0;
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 32px;
      text-align: left;
    }

    .welcome-card .info-box p {
      color: #2c5282;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .name-input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    .name-input:focus {
      border-color: #2b6cb0;
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 48px;
      min-width: 44px;
    }

    .btn-primary {
      background: #2b6cb0;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1a365d;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(26, 54, 93, 0.3);
    }

    .btn-primary:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #edf2f7;
      color: #1a365d;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-success {
      background: #38a169;
      color: white;
    }

    .btn-success:hover:not(:disabled) {
      background: #2f855a;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(56, 161, 105, 0.3);
    }

    .btn-success:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .btn-danger {
      background: #e53e3e;
      color: white;
    }

    .btn-danger:hover {
      background: #c53030;
    }

    /* Quiz Screen */
    .quiz-header {
      background: white;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-info span {
      font-size: 14px;
      color: #4a5568;
      font-weight: 500;
    }

    .progress-bar-track {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2b6cb0, #38a169);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .quiz-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    .question-meta {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge-topic {
      background: #ebf8ff;
      color: #2b6cb0;
    }

    .badge-basic {
      background: #f0fff4;
      color: #38a169;
    }

    .badge-intermediate {
      background: #fffaf0;
      color: #d69e2e;
    }

    .question-number {
      font-size: 14px;
      color: #a0aec0;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      color: #1a365d;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      padding: 16px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      font-size: 15px;
      line-height: 1.5;
      min-height: 52px;
      color: #2d3748;
      width: 100%;
    }

    .option-btn:hover {
      border-color: #2b6cb0;
      background: #ebf8ff;
    }

    .option-btn.selected {
      border-color: #2b6cb0;
      background: #ebf8ff;
      color: #1a365d;
      font-weight: 500;
    }

    .option-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      background: #edf2f7;
      color: #4a5568;
      font-weight: 700;
      font-size: 14px;
      margin-right: 14px;
    }

    .option-btn.selected .option-letter {
      background: #2b6cb0;
      color: white;
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .quiz-nav .btn {
      min-width: 120px;
    }

    /* Question Grid */
    .question-grid-toggle {
      text-align: center;
      margin-bottom: 16px;
    }

    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 6px;
      margin-bottom: 20px;
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .grid-item {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid #e2e8f0;
      background: white;
      color: #a0aec0;
      transition: all 0.15s;
      min-height: 44px;
    }

    .grid-item:hover {
      border-color: #2b6cb0;
    }

    .grid-item.answered {
      background: #ebf8ff;
      border-color: #2b6cb0;
      color: #2b6cb0;
    }

    .grid-item.current {
      background: #1a365d;
      border-color: #1a365d;
      color: white;
    }

    /* Results Screen */
    .results-screen {
      padding: 20px 0;
    }

    .results-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .results-header h1 {
      color: #1a365d;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .score-display {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      margin-bottom: 24px;
    }

    .score-big {
      font-size: 56px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .score-label {
      font-size: 16px;
      color: #718096;
      margin-bottom: 16px;
    }

    .score-bar-container {
      width: 100%;
      height: 16px;
      background: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 8px;
      transition: width 0.8s ease;
    }

    .score-assessment {
      font-size: 15px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      display: inline-block;
    }

    .topic-results {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    .topic-results h2 {
      color: #1a365d;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .topic-bar-item {
      margin-bottom: 16px;
    }

    .topic-bar-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .topic-bar-name {
      font-weight: 600;
      color: #2d3748;
    }

    .topic-bar-score {
      color: #718096;
      font-weight: 500;
    }

    .topic-bar-track {
      width: 100%;
      height: 12px;
      background: #edf2f7;
      border-radius: 6px;
      overflow: hidden;
    }

    .topic-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.6s ease;
    }

    .category-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .category-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .category-card .count {
      font-size: 36px;
      font-weight: 800;
    }

    .category-card .label {
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
    }

    .results-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 32px;
    }

    .results-actions .btn {
      min-width: 200px;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-urgent {
      background: #fff5f5;
      color: #e53e3e;
    }

    .status-review {
      background: #fffff0;
      color: #d69e2e;
    }

    .status-confident {
      background: #f0fff4;
      color: #38a169;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .app-container {
        padding: 12px;
      }

      .welcome-card {
        padding: 28px 20px;
      }

      .welcome-card h1 {
        font-size: 22px;
      }

      .quiz-card {
        padding: 20px;
      }

      .question-text {
        font-size: 16px;
      }

      .category-summary {
        grid-template-columns: 1fr;
      }

      .score-big {
        font-size: 42px;
      }

      .quiz-nav {
        flex-wrap: wrap;
      }

      .quiz-nav .btn {
        min-width: 100px;
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useCallback } = React;

    // =========================================================================
    // QUESTION BANK - 65 Real AQA A-Level Physics Questions
    // =========================================================================
    const questionBank = [
      // ── KINEMATICS (6 Questions) ──────────────────────────────────────────
      {
        id: 1,
        topic: "Kinematics",
        difficulty: "Basic",
        question: "A car accelerates uniformly from rest to 20 m/s in 8 seconds. What is the acceleration of the car?",
        options: ["1.5 m/s\u00B2", "2.5 m/s\u00B2", "3.0 m/s\u00B2", "4.0 m/s\u00B2"],
        correctAnswer: 1,
        explanation: "Using a = (v - u) / t = (20 - 0) / 8 = 2.5 m/s\u00B2."
      },
      {
        id: 2,
        topic: "Kinematics",
        difficulty: "Basic",
        question: "On a displacement\u2013time graph, what does the gradient of the line represent?",
        options: ["Acceleration", "Velocity", "Force", "Momentum"],
        correctAnswer: 1,
        explanation: "The gradient of a displacement\u2013time graph gives the velocity of the object."
      },
      {
        id: 3,
        topic: "Kinematics",
        difficulty: "Intermediate",
        question: "A ball is thrown vertically upward with an initial velocity of 15 m/s. Taking g = 9.8 m/s\u00B2, what is the maximum height reached?",
        options: ["7.7 m", "9.2 m", "11.5 m", "15.0 m"],
        correctAnswer: 2,
        explanation: "Using v\u00B2 = u\u00B2 + 2as, at maximum height v = 0: 0 = 15\u00B2 - 2(9.8)s, so s = 225 / 19.6 = 11.5 m."
      },
      {
        id: 4,
        topic: "Kinematics",
        difficulty: "Intermediate",
        question: "A stone is dropped from a cliff and takes 3.0 s to reach the ground. What is the height of the cliff? (g = 9.8 m/s\u00B2)",
        options: ["29.4 m", "44.1 m", "58.8 m", "88.2 m"],
        correctAnswer: 1,
        explanation: "Using s = ut + \u00BDat\u00B2 = 0 + \u00BD(9.8)(3.0)\u00B2 = 44.1 m."
      },
      {
        id: 5,
        topic: "Kinematics",
        difficulty: "Intermediate",
        question: "A projectile is launched horizontally at 12 m/s from a height of 45 m. How long does it take to hit the ground? (g = 10 m/s\u00B2)",
        options: ["1.5 s", "2.0 s", "3.0 s", "4.5 s"],
        correctAnswer: 2,
        explanation: "Vertical motion: s = \u00BDgt\u00B2, so 45 = \u00BD(10)t\u00B2, giving t\u00B2 = 9, t = 3.0 s. Horizontal velocity does not affect fall time."
      },
      {
        id: 6,
        topic: "Kinematics",
        difficulty: "Basic",
        question: "The area under a velocity\u2013time graph represents which quantity?",
        options: ["Acceleration", "Force", "Displacement", "Power"],
        correctAnswer: 2,
        explanation: "The area under a velocity\u2013time graph gives the displacement of the object."
      },

      // ── FORCES (6 Questions) ──────────────────────────────────────────────
      {
        id: 7,
        topic: "Forces",
        difficulty: "Basic",
        question: "According to Newton\u2019s first law, an object will remain at rest or continue to move at constant velocity unless acted upon by what?",
        options: ["A balanced force", "A resultant force", "Gravity", "Friction"],
        correctAnswer: 1,
        explanation: "Newton\u2019s first law states that an object remains at rest or in uniform motion unless acted upon by a resultant (net) force."
      },
      {
        id: 8,
        topic: "Forces",
        difficulty: "Basic",
        question: "A box of mass 25 kg is pushed across a floor with a resultant force of 50 N. What is the acceleration of the box?",
        options: ["0.5 m/s\u00B2", "2.0 m/s\u00B2", "25 m/s\u00B2", "1250 m/s\u00B2"],
        correctAnswer: 1,
        explanation: "Using F = ma, a = F/m = 50/25 = 2.0 m/s\u00B2."
      },
      {
        id: 9,
        topic: "Forces",
        difficulty: "Intermediate",
        question: "A 5.0 kg mass hangs from two strings, each making an angle of 30\u00B0 to the horizontal. What is the tension in each string? (g = 9.8 m/s\u00B2)",
        options: ["24.5 N", "28.3 N", "49.0 N", "56.6 N"],
        correctAnswer: 2,
        explanation: "Resolving vertically: 2T sin 30\u00B0 = mg, so 2T(0.5) = 49, T = 49.0 N."
      },
      {
        id: 10,
        topic: "Forces",
        difficulty: "Intermediate",
        question: "Which of the following is a correct statement of Newton\u2019s third law?",
        options: [
          "For every force, there is an equal and opposite force acting on the same object",
          "For every action on one body, there is an equal and opposite reaction on a different body",
          "The forces in a Newton\u2019s third law pair always cancel out",
          "Newton\u2019s third law only applies to objects in contact"
        ],
        correctAnswer: 1,
        explanation: "Newton\u2019s third law states that forces act between two different bodies, are equal in magnitude and opposite in direction, and are of the same type."
      },
      {
        id: 11,
        topic: "Forces",
        difficulty: "Intermediate",
        question: "A force of 80 N acts at 40\u00B0 above the horizontal. What is the horizontal component of this force?",
        options: ["51.4 N", "61.3 N", "64.3 N", "80.0 N"],
        correctAnswer: 1,
        explanation: "Horizontal component = F cos \u03B8 = 80 \u00D7 cos 40\u00B0 = 80 \u00D7 0.766 = 61.3 N."
      },
      {
        id: 12,
        topic: "Forces",
        difficulty: "Basic",
        question: "What condition must be met for an object to be in translational equilibrium?",
        options: [
          "The object must be stationary",
          "The resultant force on the object must be zero",
          "All forces on the object must be equal",
          "The object must be on a frictionless surface"
        ],
        correctAnswer: 1,
        explanation: "Translational equilibrium requires the vector sum of all forces (the resultant force) to be zero. The object may still move at constant velocity."
      },

      // ── ENERGY (6 Questions) ──────────────────────────────────────────────
      {
        id: 13,
        topic: "Energy",
        difficulty: "Basic",
        question: "A force of 200 N pushes an object 5.0 m in the direction of the force. How much work is done?",
        options: ["40 J", "100 J", "1000 J", "1250 J"],
        correctAnswer: 2,
        explanation: "Work done = Force \u00D7 distance = 200 \u00D7 5.0 = 1000 J."
      },
      {
        id: 14,
        topic: "Energy",
        difficulty: "Basic",
        question: "What is the kinetic energy of a 4.0 kg object travelling at 6.0 m/s?",
        options: ["12 J", "24 J", "72 J", "144 J"],
        correctAnswer: 2,
        explanation: "KE = \u00BDmv\u00B2 = \u00BD \u00D7 4.0 \u00D7 6.0\u00B2 = \u00BD \u00D7 4.0 \u00D7 36 = 72 J."
      },
      {
        id: 15,
        topic: "Energy",
        difficulty: "Intermediate",
        question: "A crane lifts a 200 kg load through a height of 15 m in 30 s. What is the useful power output of the crane? (g = 9.8 m/s\u00B2)",
        options: ["100 W", "490 W", "980 W", "2940 W"],
        correctAnswer: 2,
        explanation: "Work done = mgh = 200 \u00D7 9.8 \u00D7 15 = 29400 J. Power = W/t = 29400/30 = 980 W."
      },
      {
        id: 16,
        topic: "Energy",
        difficulty: "Intermediate",
        question: "A machine has an input power of 500 W and does useful work at a rate of 350 W. What is the efficiency of the machine?",
        options: ["30%", "50%", "65%", "70%"],
        correctAnswer: 3,
        explanation: "Efficiency = (useful output / total input) \u00D7 100 = (350/500) \u00D7 100 = 70%."
      },
      {
        id: 17,
        topic: "Energy",
        difficulty: "Basic",
        question: "A 0.50 kg ball falls from a height of 20 m. Assuming no air resistance, what is its speed just before it hits the ground? (g = 10 m/s\u00B2)",
        options: ["10 m/s", "14 m/s", "20 m/s", "40 m/s"],
        correctAnswer: 2,
        explanation: "By conservation of energy: mgh = \u00BDmv\u00B2, v = \u221A(2gh) = \u221A(2 \u00D7 10 \u00D7 20) = \u221A400 = 20 m/s."
      },
      {
        id: 18,
        topic: "Energy",
        difficulty: "Intermediate",
        question: "Which of the following is the correct equation for gravitational potential energy near the Earth\u2019s surface?",
        options: [
          "E = \u00BDmv\u00B2",
          "E = mgh",
          "E = \u00BDkx\u00B2",
          "E = Fd cos \u03B8"
        ],
        correctAnswer: 1,
        explanation: "Gravitational potential energy near the surface is E_p = mgh, where m is mass, g is gravitational field strength, and h is height above the reference point."
      },

      // ── MOMENTUM (5 Questions) ────────────────────────────────────────────
      {
        id: 19,
        topic: "Momentum",
        difficulty: "Basic",
        question: "A 1200 kg car travels at 15 m/s. What is its momentum?",
        options: ["80 kg m/s", "800 kg m/s", "18000 kg m/s", "180000 kg m/s"],
        correctAnswer: 2,
        explanation: "Momentum = mv = 1200 \u00D7 15 = 18000 kg m/s."
      },
      {
        id: 20,
        topic: "Momentum",
        difficulty: "Intermediate",
        question: "A 2.0 kg trolley moving at 3.0 m/s collides with a stationary 4.0 kg trolley. They stick together. What is the velocity after the collision?",
        options: ["0.5 m/s", "1.0 m/s", "1.5 m/s", "3.0 m/s"],
        correctAnswer: 1,
        explanation: "By conservation of momentum: 2.0 \u00D7 3.0 = (2.0 + 4.0) \u00D7 v, so 6.0 = 6.0v, v = 1.0 m/s."
      },
      {
        id: 21,
        topic: "Momentum",
        difficulty: "Intermediate",
        question: "A force of 600 N acts on a ball for 0.02 s during a kick. What is the impulse delivered to the ball?",
        options: ["3 N s", "6 N s", "12 N s", "30000 N s"],
        correctAnswer: 2,
        explanation: "Impulse = F\u0394t = 600 \u00D7 0.02 = 12 N s."
      },

    // =========================================================================
    // HELPER FUNCTIONS
    // =========================================================================
    function calculateTopicScores(answers) {
      const topics = {};
      questionBank.forEach((q) => {
        if (!topics[q.topic]) {
          topics[q.topic] = { correct: 0, total: 0 };
        }
        topics[q.topic].total += 1;
        if (answers[q.id] === q.correctAnswer) {
          topics[q.topic].correct += 1;
        }
      });
      return topics;
    }

    function getPerformanceCategory(percentage) {
      if (percentage < 60) return { label: "URGENT", color: "#e53e3e", bg: "#fff5f5" };
      if (percentage <= 80) return { label: "REVIEW", color: "#d69e2e", bg: "#fffff0" };
      return { label: "CONFIDENT", color: "#38a169", bg: "#f0fff4" };
    }

    function calculatePriorityScore(topic, percentage) {
      const meta = topicMetadata[topic];
      const performanceGap = (100 - percentage) / 10;
      return (meta.examWeight * 0.4) + (performanceGap * 0.4) + (meta.dependencyScore * 0.2);
    }

    function getScoreColor(pct) {
      if (pct >= 80) return "#38a169";
      if (pct >= 60) return "#d69e2e";
      return "#e53e3e";
    }

    // =========================================================================
    // QUIZ SCREEN
    // =========================================================================
    function QuizScreen({ studentName, onSubmit }) {
      const [currentQ, setCurrentQ] = useState(0);
      const [answers, setAnswers] = useState({});
      const [showGrid, setShowGrid] = useState(false);

      const question = questionBank[currentQ];
      const totalQ = questionBank.length;
      const answeredCount = Object.keys(answers).length;
      const allAnswered = answeredCount === totalQ;
      const progressPct = (answeredCount / totalQ) * 100;

      const selectOption = (index) => {
        setAnswers((prev) => ({ ...prev, [question.id]: index }));
      };

      const goTo = (idx) => {
        if (idx >= 0 && idx < totalQ) setCurrentQ(idx);
      };

      return (
        <div>
          {/* Header */}
          <div className="quiz-header">
            <div className="progress-info">
              <span>Question {currentQ + 1} of {totalQ}</span>
              <span>{answeredCount}/{totalQ} answered ({Math.round(progressPct)}%)</span>
            </div>
            <div className="progress-bar-track">
              <div className="progress-bar-fill" style={{ width: progressPct + "%" }} />
            </div>
          </div>

          {/* Question Grid Toggle */}
          <div className="question-grid-toggle">
            <button
              className="btn btn-secondary"
              onClick={() => setShowGrid(!showGrid)}
              style={{ fontSize: "14px", padding: "8px 16px" }}
            >
              {showGrid ? "Hide" : "Show"} Question Navigator
            </button>
          </div>

          {/* Question Grid */}
          {showGrid && (
            <div className="question-grid">
              {questionBank.map((q, idx) => (
                <button
                  key={q.id}
                  className={
                    "grid-item" +
                    (idx === currentQ ? " current" : "") +
                    (answers[q.id] !== undefined && idx !== currentQ ? " answered" : "")
                  }
                  onClick={() => goTo(idx)}
                >
                  {idx + 1}
                </button>
              ))}
            </div>
          )}

          {/* Quiz Card */}
          <div className="quiz-card">
            <div className="question-meta">
              <span className="badge badge-topic" style={{ background: topicColors[question.topic] + "20", color: topicColors[question.topic] }}>
                {question.topic}
              </span>
              <span className={"badge " + (question.difficulty === "Basic" ? "badge-basic" : "badge-intermediate")}>
                {question.difficulty}
              </span>
            </div>
            <div className="question-number">Question {currentQ + 1}</div>
            <div className="question-text">{question.question}</div>
            <div className="options-list">
              {question.options.map((opt, idx) => {
                const letters = ["A", "B", "C", "D"];
                const isSelected = answers[question.id] === idx;
                return (
                  <button
                    key={idx}
                    className={"option-btn" + (isSelected ? " selected" : "")}
                    onClick={() => selectOption(idx)}
                  >
                    <span className="option-letter">{letters[idx]}</span>
                    <span>{opt}</span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Navigation */}
          <div className="quiz-nav">
            <button
              className="btn btn-secondary"
              disabled={currentQ === 0}
              onClick={() => goTo(currentQ - 1)}
            >
              Previous
            </button>
            {currentQ < totalQ - 1 ? (
              <button
                className="btn btn-primary"
                onClick={() => goTo(currentQ + 1)}
              >
                Next
              </button>
            ) : (
              <button
                className="btn btn-success"
                disabled={!allAnswered}
                onClick={() => onSubmit(answers)}
                title={allAnswered ? "Submit your assessment" : "Answer all questions before submitting"}
              >
                Submit Assessment {!allAnswered ? `(${totalQ - answeredCount} remaining)` : ""}
              </button>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================

    function ResultsScreen({ studentName, answers, onRetake }) {

      // Calculate topic scores
      const topicScores = calculateTopicScores(answers);

      // Build sorted topic data
      const topicData = Object.entries(topicScores).map(([topic, data]) => {
        const pct = Math.round((data.correct / data.total) * 100);
        const priority = calculatePriorityScore(topic, pct);
        const category = getPerformanceCategory(pct);
        return { topic, correct: data.correct, total: data.total, pct, priority, category };
      });

      topicData.sort((a, b) => b.priority - a.priority);

        doc.setFont("helvetica", "bold");
        doc.setTextColor(56, 161, 105);
        doc.text("Week 5+: Full Practice Papers & Refinement", margin, y);
        doc.setTextColor(0, 0, 0);
        y += 8;
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        const w5Lines = doc.splitTextToSize(
          "Attempt full past papers under exam conditions. Review your answers against mark schemes, paying attention to command words and required depth of explanation. Focus on synoptic links between topics and multi-step calculations.",
          contentW - 8
        );
        doc.text(w5Lines, margin + 4, y);
        y += w5Lines.length * 5 + 14;

        doc.setFontSize(13);
        doc.setFont("helvetica", "bold");
        doc.text("General Study Tips", margin, y);
        y += 8;
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");

        const tips = [
          "Use active recall and spaced repetition to strengthen long-term memory.",
          "Create concept maps linking related topics (e.g., Forces \u2192 Energy \u2192 Momentum).",
          "Practise calculations with full working, including units at every step.",
          "Review the AQA specification checklist to ensure complete coverage.",
          "Form study groups to explain concepts to peers \u2014 teaching deepens understanding.",
          "Consult your teacher for targeted support on persistent problem areas."
        ];

        tips.forEach((tip) => {
          if (y > 270) {
            doc.addPage();
            y = 20;
          }
          doc.text("\u2022  " + tip, margin + 4, y);
          y += 7;
        });

        // Footer on each page
        const totalPages = doc.internal.getNumberOfPages();
        for (let i = 1; i <= totalPages; i++) {
          doc.setPage(i);
          doc.setFontSize(8);
          doc.setTextColor(160, 174, 192);
          doc.text("AQA A-Level Physics Foundation Tier Diagnostic | Generated " + today, margin, 290);
          doc.text("Page " + i + " of " + totalPages, pageW - margin - 25, 290);
        }

        doc.save("AQA_Physics_Diagnostic_" + studentName.replace(/\s+/g, "_") + ".pdf");
      };

      return (
        <div className="results-screen">
          <div className="results-header">
            <h1>Assessment Complete</h1>
            <p style={{ color: "#718096" }}>Results for {studentName}</p>
          </div>

          {/* Score Display */}
          <div className="score-display">
            <div className="score-big" style={{ color: getScoreColor(overallPct) }}>
              {overallPct}%
            </div>
            <div className="score-label">{totalCorrect} out of {questionBank.length} correct</div>
            <div className="score-bar-container">
              <div
                className="score-bar-fill"
                style={{ width: overallPct + "%", background: getScoreColor(overallPct) }}
              />
            </div>
            <div className="score-assessment" style={{ background: getScoreColor(overallPct) + "18", color: getScoreColor(overallPct) }}>
              {assessmentText}
            </div>
          </div>

          {/* Category Summary */}
          <div className="category-summary">
            <div className="category-card">
              <div className="count" style={{ color: "#e53e3e" }}>{urgentCount}</div>
              <div className="label" style={{ color: "#e53e3e" }}>Urgent</div>
              <div style={{ fontSize: "12px", color: "#a0aec0", marginTop: "4px" }}>Below 60%</div>
            </div>
            <div className="category-card">
              <div className="count" style={{ color: "#d69e2e" }}>{reviewCount}</div>
              <div className="label" style={{ color: "#d69e2e" }}>Review</div>
              <div style={{ fontSize: "12px", color: "#a0aec0", marginTop: "4px" }}>60% - 80%</div>
            </div>
            <div className="category-card">
              <div className="count" style={{ color: "#38a169" }}>{confidentCount}</div>
              <div className="label" style={{ color: "#38a169" }}>Confident</div>
              <div style={{ fontSize: "12px", color: "#a0aec0", marginTop: "4px" }}>Above 80%</div>
            </div>
          </div>

          {/* Top 5 Weakest Topics */}
          <div className="topic-results">
            <h2>Top 5 Priority Topics</h2>
            {weakest5.map((t) => (
              <div className="topic-bar-item" key={t.topic}>
                <div className="topic-bar-label">
                  <span className="topic-bar-name">
                    {t.topic}
                    <span
                      className={"status-badge " + "status-" + t.category.label.toLowerCase()}
                      style={{ marginLeft: "10px" }}
                    >
                      {t.category.label}
                    </span>
                  </span>
                  <span className="topic-bar-score">{t.correct}/{t.total} ({t.pct}%)</span>
                </div>
                <div className="topic-bar-track">
                  <div
                    className="topic-bar-fill"
                    style={{ width: t.pct + "%", background: t.category.color }}
                  />
                </div>
              </div>
            ))}
          </div>

          {/* All Topics */}
          <div className="topic-results">
            <h2>All Topics (Ranked by Priority)</h2>
            {topicData.map((t) => (
              <div className="topic-bar-item" key={t.topic}>
                <div className="topic-bar-label">
                  <span className="topic-bar-name">
                    {t.topic}
                    <span
                      className={"status-badge " + "status-" + t.category.label.toLowerCase()}
                      style={{ marginLeft: "10px" }}
                    >
                      {t.category.label}
                    </span>
                  </span>
                  <span className="topic-bar-score">{t.correct}/{t.total} ({t.pct}%)</span>
                </div>
                <div className="topic-bar-track">
                  <div
                    className="topic-bar-fill"
                    style={{ width: t.pct + "%", background: t.category.color }}
                  />
                </div>
              </div>
            ))}
          </div>

          {/* Actions */}
          <div className="results-actions">
            <button className="btn btn-primary" onClick={generatePDF}>
              Download PDF Report
            </button>
            <button className="btn btn-secondary" onClick={onRetake}>
              Retake Assessment
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // APP COMPONENT
    // =========================================================================
    function App() {
      const [screen, setScreen] = useState("welcome");
      const [studentName, setStudentName] = useState("");
      const [answers, setAnswers] = useState({});

      const handleStart = (name) => {
        setStudentName(name);
        setScreen("quiz");
      };

      const handleSubmit = (ans) => {
        setAnswers(ans);
        setScreen("results");
        window.scrollTo(0, 0);
      };

      const handleRetake = () => {
        setAnswers({});
        setScreen("quiz");
        window.scrollTo(0, 0);
      };

      return (
        <div className="app-container">
          {screen === "welcome" && <WelcomeScreen onStart={handleStart} />}
          {screen === "quiz" && <QuizScreen studentName={studentName} onSubmit={handleSubmit} />}
          {screen === "results" && (
            <ResultsScreen studentName={studentName} answers={answers} onRetake={handleRetake} />
          )}
        </div>
      );
    }

    // =========================================================================
    // RENDER
    // =========================================================================
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
